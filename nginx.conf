server {
  listen 80;
  server_name localhost;
  root /usr/share/nginx/html;
  index index.html;

  # Mirror Vercel's "rewrites" locally: these aren't real files, just
  # scroll targets on the homepage, so serve index.html for them
  # directly instead of 404ing.
  location ~ ^/(work|skills|about|contact)$ {
    try_files /index.html =404;
  }

  # Mirror Vercel's cleanUrls locally: /repquest resolves to
  # repquest.html, so local testing matches how the deployed site
  # actually behaves instead of just the raw filenames.
  location / {
    try_files $uri $uri.html $uri/ =404;
  }
}
